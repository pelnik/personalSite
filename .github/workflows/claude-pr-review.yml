name: Claude PR Review
on:
  # Review once when a PR is ready, not on every push. Comment "@claude" on the PR to re-run.
  pull_request:
    types: [opened, ready_for_review, reopened]
  issue_comment:
    types: [created]

jobs:
  review:
    # Non-draft PR events, or an "@claude" comment on a PR (not an issue) from someone with write access.
    # Dependabot PRs are skipped: the action rejects bot actors, and Dependabot runs don't get Actions secrets.
    if: |
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Please review this pull request with a focus on:
            - Code quality and best practices
            - Potential bugs or issues
            - Security implications
            - Performance considerations
            - Linked GitHub issues: read each issue the PR references (Fixes #N / Refs #N), with
              its comments, and confirm the change addresses it. Also check open `bug` issues and
              flag any this PR fixes without linking.
            - Design specs: if a linked issue has a "Design spec" comment, check the PR against it.
              Flag differences the PR doesn't list under "Deviations from spec", and acceptance
              criteria it doesn't meet.

            You are "the reviewer" in AGENTS.md.

            Provide detailed feedback using inline comments for specific issues.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh issue list:*)"
