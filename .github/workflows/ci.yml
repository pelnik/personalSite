name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE juicebox;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fitness;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE scents;"

      - name: Run tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/juicebox
          FITNESS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitness
          SCENTS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scents
          JWT_SECRET: test-secret-for-ci
          API_URL: http://localhost:3000/api/fitness
        run: npm run test:fitness

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npm run build

      - name: Copy build to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_PROJECT_PATH }}/build/
          rm /tmp/deploy_key

      - name: Pull source & restart server
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cd ${{ secrets.EC2_PROJECT_PATH }} && git pull origin main && pm2 restart personalsite"
          rm /tmp/deploy_key
