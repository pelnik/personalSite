name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/juicebox
      FITNESS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/fitness
      SCENTS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/scents
      JWT_SECRET: test-secret-for-ci
      API_URL: http://localhost:3000/api/fitness

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same version the server runs, so a .nvmrc bump is tested here first.
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # Vite doesn't type-check when it builds (CRA did), so check here.
      - name: Type check
        run: npm run typecheck

      - name: Create test databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE juicebox;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE fitness;"
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE scents;"

      - name: Run API tests
        run: npm run test:api

      - name: Build frontend
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Screenshot comparisons are local-only (baselines are macOS-specific).
      - name: Run end-to-end tests
        run: npm run test:e2e:functional

      # Deploy ships this exact bundle, the one the e2e tests just checked.
      - name: Upload build
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: build/
          retention-days: 1

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Download tested build
        uses: actions/download-artifact@v4
        with:
          name: build
          path: build/

      - name: Copy build to EC2
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          rsync -avz --delete \
            -e "ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no" \
            build/ \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_PROJECT_PATH }}/build/
          rm /tmp/deploy_key

      # The SSH session doesn't load nvm, so it's sourced here, and `nvm use`
      # picks the version in .nvmrc (see DEPLOYMENT.md for upgrading Node).
      # npm ci installs only production dependencies (the frontend is already
      # built), so the server always runs with exactly the dependencies in
      # package-lock.json.
      #
      # If nvm use fails (that Node isn't installed on the server) or npm ci
      # fails partway (it empties node_modules first), the source goes back
      # to the previous commit and its dependencies are reinstalled, so the
      # running server can still restart; then the job fails. (build/ has
      # already been replaced by then: rerun the deploy or revert once the
      # cause is fixed.)
      #
      # The app is deleted and started again from ecosystem.config.js, rather
      # than restarted, because pm2 restart doesn't apply changed node_args or
      # limits from the file. The downtime is the same as a restart.
      - name: Pull source, install dependencies & restart server
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key
          ssh -i /tmp/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "set -e
             export NVM_DIR=\$HOME/.nvm
             . \$NVM_DIR/nvm.sh --no-use
             cd ${{ secrets.EC2_PROJECT_PATH }}
             PREVIOUS=\$(git rev-parse HEAD)
             git pull origin main
             if ! nvm use || ! npm ci --omit=dev; then
               git reset --hard \$PREVIOUS
               nvm use || true
               npm ci --omit=dev || true
               exit 1
             fi
             pm2 delete personalsite 2>/dev/null || true
             pm2 start ecosystem.config.js
             pm2 save
             curl -fsS --retry 10 --retry-delay 3 --retry-connrefused http://localhost/api/health"
          rm /tmp/deploy_key
